[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
colored = "3.1.1"
sea-orm = { version = "1.0", features = [
    "sqlx-sqlite",
    "runtime-tokio-native-tls",
    "macros",
    "with-uuid",
] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.29.0", features = ["v4"] }
